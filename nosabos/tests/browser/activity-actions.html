<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Activity action regression checks</title></head><body><div id="root"></div><script type="module">
if (new URLSearchParams(location.search).has("reducedMotion")) {
  const original = window.matchMedia.bind(window);
  window.matchMedia = query => query.includes("prefers-reduced-motion")
    ? {matches:true, media:query, addListener(){}, removeListener(){}, addEventListener(){}, removeEventListener(){}}
    : original(query);
}
await import("./activity-actions.jsx");
</script></body></html>
